<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificator CAD</title>
<style>
/* --- Reset & font --- */
* {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
body {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#e5e7eb;
    overflow:hidden;
    background: linear-gradient(180deg,#0f1115,#1a1c24);
}

/* --- Fundal animat tip val PS3, mai vizibil --- */
.wave-bg {
    position: fixed;
    top:0; left:0; width:100%; height:100%;
    overflow:hidden;
    z-index:-1;
    background: linear-gradient(180deg,#0a0c12,#11141d);
}

.wave-layer {
    position:absolute;
    width:300%; height:300%;
    background: radial-gradient(circle at 50% 50%, rgba(0,246,255,0.15), transparent 60%);
    border-radius:50%;
    animation: waveMove 10s ease-in-out infinite;
}

.wave-layer:nth-child(1){ animation-duration: 12s; opacity:0.6; }
.wave-layer:nth-child(2){ animation-duration: 16s; opacity:0.5; }
.wave-layer:nth-child(3){ animation-duration: 20s; opacity:0.4; }

@keyframes waveMove {
    0% {transform: translateX(0) translateY(0) rotate(0deg);}
    25% {transform: translateX(50px) translateY(30px) rotate(5deg);}
    50% {transform: translateX(-50px) translateY(20px) rotate(-5deg);}
    75% {transform: translateX(50px) translateY(10px) rotate(5deg);}
    100% {transform: translateX(0) translateY(0) rotate(0deg);}
}


/* --- Card central --- */
.card {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 0 30px rgba(0,255,255,0.6), 0 20px 60px rgba(0,0,0,0.5);
    text-align:center;
    position: relative;
    z-index: 1;
}

/* --- Titlu neon pulsant --- */
h1 {
    margin-bottom: 25px;
    font-size:28px;
    color:#00f6ff;
    text-shadow: 0 0 5px #00f6ff, 0 0 10px #00f6ff, 0 0 20px #00f6ff;
    animation: pulse 2s infinite;
}
@keyframes pulse {
    0%, 100% {text-shadow: 0 0 5px #00f6ff, 0 0 10px #00f6ff, 0 0 20px #00f6ff;}
    50% {text-shadow: 0 0 15px #00f6ff, 0 0 30px #00f6ff, 0 0 50px #00f6ff;}
}

/* --- Upload imagine --- */
.upload-wrapper {
    border: 2px dashed #00f6ff;
    border-radius: 12px;
    padding: 15px;
    cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(0,0,0,0.3);
    position: relative;
    margin-bottom: 220px;
}
.upload-wrapper:hover {
    background: rgba(0,255,255,0.1);
    box-shadow: 0 0 15px #00f6ff;
}
input[type="file"] {display:none;}

/* --- Preview imagine --- */
#preview {
    max-width: 180px;
    max-height: 180px;
    margin: 15px auto;
    border-radius: 12px;
    box-shadow: 0 0 20px #00f6ff;
    border: 2px solid #00f6ff;
    display: none;
}

/* --- Buton clasificare --- */
button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg,#00f6ff,#00c6ff);
    color: #000;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
button:disabled {opacity:0.5;cursor:not-allowed;}
button:hover:not(:disabled) {transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,255,255,0.5);}

/* --- Loading bar --- */
#loadingBarContainer {
    width: 100%;
    height: 12px;
    background: rgba(255,255,255,0.2);
    border-radius: 6px;
    margin: 15px 0;
    overflow: hidden;
    display: none;
}
#loadingBar {
    width: 0%;
    height: 100%;
    background: #00f6ff;
    transition: width 0.2s ease;
}

/* --- Rezultate --- */
#result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    background: rgba(0,255,255,0.1);
    display: none;
}
.progress-bar {width:100%;background: rgba(255,255,255,0.2);border-radius:6px;height:12px;margin:6px 0;overflow:hidden;}
.progress-bar-inner {height:100%;width:0%;background:#00f6ff;transition: width 0.3s ease;}
.progress-label {font-size:14px;margin-bottom:2px;}
</style>
</head>
<body>
<div class="wave-bg">
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
    <div class="wave-layer"></div>
</div>

<div class="card">
    <h1>Clasificator CAD</h1>
    <label class="upload-wrapper">
        Alege o imagine
        <input type="file" id="imageInput" accept="image/*">
    </label>
    <img id="preview" alt="Preview">
    <button type="button" id="classifyBtn" disabled>Clasifică imaginea</button>
    <div id="loadingBarContainer"><div id="loadingBar"></div></div>
    <div id="result"><div id="resultText"></div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const classifyBtn = document.getElementById('classifyBtn');
    const loadingBarContainer = document.getElementById('loadingBarContainer');
    const loadingBar = document.getElementById('loadingBar');
    const result = document.getElementById('result');
    const resultText = document.getElementById('resultText');

    const CATEGORIES = [
        "CATEGORIA_1_Surub",
        "CATEGORIA_2_Bolt_De_Ghidaj",
        "CATEGORIA_3_Piulita",
        "CATEGORIA_4_Saiba"
    ];

    imageInput.addEventListener('change', function(e){
        const file = e.target.files[0];
        if(file){
            classifyBtn.disabled = false;
            const reader = new FileReader();
            reader.onload = function(e){
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    function renderResult(data){
        resultText.innerHTML = "";
        CATEGORIES.forEach(cat=>{
            const value = parseFloat(data[cat] ? data[cat].replace('%','') : 0);
            const wrapper = document.createElement('div');
            const label = document.createElement('div');
            label.className = "progress-label";
            label.textContent = cat.replace(/_/g,' ') + `: ${value.toFixed(2)}%`;
            const barOuter = document.createElement('div');
            barOuter.className = "progress-bar";
            const barInner = document.createElement('div');
            barInner.className = "progress-bar-inner";
            barInner.style.width = `${value}%`;
            barOuter.appendChild(barInner);
            wrapper.appendChild(label);
            wrapper.appendChild(barOuter);
            resultText.appendChild(wrapper);
        });
        result.style.display = 'block';
    }

    classifyBtn.addEventListener('click', async function(){
        const file = imageInput.files[0];
        if(!file) return;

        result.style.display = 'none';
        loadingBarContainer.style.display = 'block';
        loadingBar.style.width = '0%';
        classifyBtn.disabled = true;

        const formData = new FormData();
        formData.append('file', file);

        let progress = 0;
        const interval = setInterval(()=> {
            if(progress < 90){
                progress += Math.random()*10;
                loadingBar.style.width = `${Math.min(progress,90)}%`;
            }
        }, 100);

        try{
            const response = await fetch('/clasifica', {method:'POST', body: formData});
            const data = await response.json();

            clearInterval(interval);
            loadingBar.style.width = '100%';

            renderResult(data);
        } catch(err){
            console.error(err);
            alert("Eroare la clasificare.");
        } finally{
            classifyBtn.disabled = false;
            setTimeout(()=>loadingBarContainer.style.display='none', 500);
        }
    });
});
</script>
</body>
</html>
